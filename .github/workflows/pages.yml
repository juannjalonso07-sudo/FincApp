# Publica la PWA en GitHub Pages (https://<usuario>.github.io/<repo>/) para instalarla en el celular.
# Requisitos: Settings → Pages → Source: "GitHub Actions"; y los secrets VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY.
name: Publicar PWA
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PRO_PRICE_ARS: ${{ vars.VITE_PRO_PRICE_ARS }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_LEGAL_NAME: ${{ vars.VITE_LEGAL_NAME }}
          VITE_LEGAL_CUIT: ${{ vars.VITE_LEGAL_CUIT }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
